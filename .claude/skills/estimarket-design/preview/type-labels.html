<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 20px; background: var(--color-bg-surface); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); flex: 0 0 100px; }
  .spec { color: var(--color-text-primary); }
  .l-lg { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
  .l-md { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
  .l-sm { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
  .cap  { font-size: 12px; line-height: 1.4; color: var(--color-text-muted); }
</style></head><body>
<div class="stack">
  <div class="row"><div class="label">label-lg<br>16 · 600</div><div class="spec l-lg">Project type</div></div>
  <div class="row"><div class="label">label-md<br>14 · 600</div><div class="spec l-md">ZIP code</div></div>
  <div class="row"><div class="label">label-sm<br>12 · 600 · uppercase</div><div class="spec l-sm">Licensed pro</div></div>
  <div class="row"><div class="label">caption<br>12 / 1.4</div><div class="spec cap">$12,400 estimate · Materials included · Excludes permits</div></div>
</div>
</body></html>
