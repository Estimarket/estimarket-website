<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--color-bg-surface); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { aspect-ratio: 1 / 1.2; border-radius: var(--radius-md); border: 1px solid rgba(14,33,75,0.08); }
  .name { font-size: 11px; font-weight: 600; color: var(--color-text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#111827"></div><div class="name">900</div><div class="hex">#111827</div></div>
  <div class="sw"><div class="chip" style="background:#374151"></div><div class="name">700</div><div class="hex">#374151</div></div>
  <div class="sw"><div class="chip" style="background:#6B7280"></div><div class="name">500</div><div class="hex">#6B7280</div></div>
  <div class="sw"><div class="chip" style="background:#D1D5DB"></div><div class="name">300</div><div class="hex">#D1D5DB</div></div>
  <div class="sw"><div class="chip" style="background:#F3F4F6"></div><div class="name">100</div><div class="hex">#F3F4F6</div></div>
  <div class="sw"><div class="chip" style="background:#F9FAFB"></div><div class="name">50</div><div class="hex">#F9FAFB</div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">0 · white</div><div class="hex">#FFFFFF</div></div>
</div>
</body></html>
