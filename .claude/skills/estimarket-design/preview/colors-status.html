<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--color-bg-surface); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { aspect-ratio: 1.4 / 1; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; }
  .name { font-size: 12px; font-weight: 600; color: var(--color-text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#16A34A">Success</div><div class="name">--color-status-success</div><div class="hex">#16A34A</div></div>
  <div class="sw"><div class="chip" style="background:#D97706">Warning</div><div class="name">--color-status-warning</div><div class="hex">#D97706</div></div>
  <div class="sw"><div class="chip" style="background:#DC2626">Error</div><div class="name">--color-status-error</div><div class="hex">#DC2626</div></div>
  <div class="sw"><div class="chip" style="background:#328EEE">Info</div><div class="name">--color-status-info</div><div class="hex">#328EEE</div></div>
</div>
</body></html>
