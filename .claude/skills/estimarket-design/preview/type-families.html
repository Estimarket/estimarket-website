<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px 20px; background: var(--color-bg-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .item { display: flex; flex-direction: column; gap: 4px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
  .sample-display { font-family: var(--font-display); font-style: italic; font-size: 44px; color: var(--color-primary-darkest); line-height: 1; }
  .sample-sans { font-family: var(--font-body); font-size: 30px; font-weight: 600; color: var(--color-text-primary); line-height: 1.1; }
  .meta { font-size: 12px; color: var(--color-text-muted); }
</style></head><body>
<div class="grid">
  <div class="item">
    <div class="tag">--font-display</div>
    <div class="sample-display">estimarket</div>
    <div class="meta">DM Serif Display Italic · brand font, loaded locally</div>
  </div>
  <div class="item">
    <div class="tag">--font-body / --font-heading</div>
    <div class="sample-sans">Contractors compete. You choose.</div>
    <div class="meta">DM Sans Variable (opsz 9–40, wght 100–1000) · loaded locally</div>
  </div>
</div>
</body></html>
