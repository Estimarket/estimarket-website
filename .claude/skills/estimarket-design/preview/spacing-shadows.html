<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 32px 20px; background: var(--color-bg-page); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .sw { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .card { width: 76px; height: 76px; background: white; border-radius: 8px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-primary); font-weight: 600; }
</style></head><body>
<div class="row">
  <div class="sw"><div class="card" style="box-shadow: 0 1px 2px rgba(14,33,75,0.06)"></div><div class="name">xs</div></div>
  <div class="sw"><div class="card" style="box-shadow: 0 1px 3px rgba(14,33,75,0.10), 0 1px 2px rgba(14,33,75,0.06)"></div><div class="name">sm</div></div>
  <div class="sw"><div class="card" style="box-shadow: 0 4px 6px rgba(14,33,75,0.08), 0 2px 4px rgba(14,33,75,0.06)"></div><div class="name">md</div></div>
  <div class="sw"><div class="card" style="box-shadow: 0 10px 15px rgba(14,33,75,0.10), 0 4px 6px rgba(14,33,75,0.05)"></div><div class="name">lg</div></div>
  <div class="sw"><div class="card" style="box-shadow: 0 20px 25px rgba(14,33,75,0.12), 0 10px 10px rgba(14,33,75,0.04)"></div><div class="name">xl</div></div>
  <div class="sw"><div class="card" style="box-shadow: 0 25px 50px rgba(14,33,75,0.20)"></div><div class="name">2xl</div></div>
</div>
</body></html>
