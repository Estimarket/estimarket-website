<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 26px 20px; background: var(--color-bg-surface); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); flex: 0 0 80px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: #E85D26; color: #fff; border: 0; font-family: var(--font-body); font-weight: 600; cursor: pointer; }
  .sm { height: 32px; padding: 0 12px; font-size: 12px; border-radius: 4px; letter-spacing: 0.02em; }
  .md { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 4px; letter-spacing: 0.01em; }
  .lg { height: 48px; padding: 0 24px; font-size: 16px; border-radius: 4px; letter-spacing: 0.01em; }
  .xl { height: 56px; padding: 0 32px; font-size: 18px; border-radius: 8px; font-weight: 600; }
</style></head><body>
<div class="row"><div class="lbl">sm · 32</div><button class="btn sm">Book now</button></div>
<div class="row"><div class="lbl">md · 40</div><button class="btn md">Book now</button></div>
<div class="row"><div class="lbl">lg · 48</div><button class="btn lg">Book now</button></div>
<div class="row"><div class="lbl">xl · 56</div><button class="btn xl">Book now</button></div>
</body></html>
