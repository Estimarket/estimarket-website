<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 20px; background: var(--color-bg-surface); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); flex: 0 0 100px; }
  .spec { color: var(--color-text-primary); }
  .h1 { font-size: 36px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  .h2 { font-size: 30px; line-height: 1.25; font-weight: 600; }
  .h3 { font-size: 24px; line-height: 1.3;  font-weight: 600; }
  .h4 { font-size: 20px; line-height: 1.35; font-weight: 600; }
  .h5 { font-size: 18px; line-height: 1.4;  font-weight: 600; }
</style></head><body>
<div class="stack">
  <div class="row"><div class="label">heading-xl<br>36 · 700</div><div class="spec h1">Find pros near you</div></div>
  <div class="row"><div class="label">heading-lg<br>30 · 600</div><div class="spec h2">Popular project types</div></div>
  <div class="row"><div class="label">heading-md<br>24 · 600</div><div class="spec h3">Kitchen remodel · Oakland, CA</div></div>
  <div class="row"><div class="label">heading-sm<br>20 · 600</div><div class="spec h4">What's included in this bid</div></div>
  <div class="row"><div class="label">heading-xs<br>18 · 600</div><div class="spec h5">Licensed, insured, and reviewed</div></div>
</div>
</body></html>
