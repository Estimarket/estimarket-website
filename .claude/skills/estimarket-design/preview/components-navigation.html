<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 18px 20px; background: var(--color-bg-page); display: flex; flex-direction: column; gap: 10px; }
  .bar { background: #fff; padding: 10px 20px; border-radius: 12px; display: flex; align-items: center; gap: 28px; box-shadow: 0 1px 2px rgba(14,33,75,0.06); }
  .bar.dark { background: #0E214B; }
  .bar.dark .link { color: rgba(255,255,255,0.78); }
  .bar.dark .link.active { color: #fff; }
  .wm { font-family: var(--font-display); font-style: italic; font-size: 28px; color: #0E214B; line-height: 1; }
  .bar.dark .wm { color: #fff; }
  .links { display: flex; gap: 22px; flex: 1; }
  .link { font-size: 14px; font-weight: 600; color: var(--color-text-primary); cursor: pointer; padding-bottom: 4px; }
  .link.active { color: var(--color-primary); border-bottom: 4px solid var(--color-primary); }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn-primary { background: #E85D26; color: #fff; height: 36px; padding: 0 16px; border-radius: 4px; font-size: 13px; font-weight: 600; display: flex; align-items: center; }
  .btn-ghost { color: var(--color-primary); font-size: 14px; font-weight: 600; cursor: pointer; }
  .bar.dark .btn-ghost { color: rgba(255,255,255,0.92); }
</style></head><body>
<div class="bar">
  <div class="wm">estimarket</div>
  <div class="links">
    <span class="link active">Stays</span>
    <span class="link">Experiences</span>
    <span class="link">Trips</span>
    <span class="link">Inbox</span>
  </div>
  <div class="actions">
    <span class="btn-ghost">List your property</span>
    <span class="btn-primary">Sign in</span>
  </div>
</div>
<div class="bar dark">
  <div class="wm">estimarket</div>
  <div class="links">
    <span class="link active">Stays</span>
    <span class="link">Experiences</span>
    <span class="link">Trips</span>
  </div>
  <div class="actions">
    <span class="btn-ghost">List your property</span>
    <span class="btn-primary">Sign in</span>
  </div>
</div>
</body></html>
