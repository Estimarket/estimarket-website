<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--color-bg-surface); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 14px; height: 28px; }
  .bar { background: var(--color-primary); height: 16px; border-radius: 2px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); flex: 0 0 92px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-primary); font-weight: 600; flex: 0 0 40px; text-align: right; }
</style></head><body>
<div class="stack">
  <div class="row"><div class="label">space-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>
  <div class="row"><div class="label">space-2</div><div class="bar" style="width:8px"></div><div class="px">8</div></div>
  <div class="row"><div class="label">space-3</div><div class="bar" style="width:12px"></div><div class="px">12</div></div>
  <div class="row"><div class="label">space-4</div><div class="bar" style="width:16px"></div><div class="px">16</div></div>
  <div class="row"><div class="label">space-6</div><div class="bar" style="width:24px"></div><div class="px">24</div></div>
  <div class="row"><div class="label">space-8</div><div class="bar" style="width:32px"></div><div class="px">32</div></div>
  <div class="row"><div class="label">space-12</div><div class="bar" style="width:48px"></div><div class="px">48</div></div>
  <div class="row"><div class="label">space-16</div><div class="bar" style="width:64px"></div><div class="px">64</div></div>
  <div class="row"><div class="label">space-20</div><div class="bar" style="width:80px"></div><div class="px">80</div></div>
  <div class="row"><div class="label">space-24</div><div class="bar" style="width:96px"></div><div class="px">96</div></div>
</div>
</body></html>
