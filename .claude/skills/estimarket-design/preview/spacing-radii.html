<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--color-bg-surface); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .chip { width: 64px; height: 64px; background: var(--color-primary-lightest); border: 1.5px solid var(--color-primary); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-primary); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="border-radius:0"></div><div class="name">none</div><div class="px">0</div></div>
  <div class="sw"><div class="chip" style="border-radius:2px"></div><div class="name">xs</div><div class="px">2</div></div>
  <div class="sw"><div class="chip" style="border-radius:4px"></div><div class="name">sm</div><div class="px">4</div></div>
  <div class="sw"><div class="chip" style="border-radius:8px"></div><div class="name">md</div><div class="px">8</div></div>
  <div class="sw"><div class="chip" style="border-radius:12px"></div><div class="name">lg</div><div class="px">12</div></div>
  <div class="sw"><div class="chip" style="border-radius:16px"></div><div class="name">xl</div><div class="px">16</div></div>
  <div class="sw"><div class="chip" style="border-radius:24px"></div><div class="name">2xl</div><div class="px">24</div></div>
</div>
</body></html>
