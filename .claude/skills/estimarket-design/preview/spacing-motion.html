<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 20px; background: var(--color-bg-surface); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-primary); flex: 0 0 130px; }
  .bar { height: 6px; background: var(--color-primary); border-radius: 3px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
</style></head><body>
<div class="stack">
  <div class="row"><div class="label">instant</div><div class="bar" style="width: 16px"></div><div class="meta">80ms · hover color</div></div>
  <div class="row"><div class="label">fast</div><div class="bar" style="width: 30px"></div><div class="meta">150ms · button press</div></div>
  <div class="row"><div class="label">normal</div><div class="bar" style="width: 50px"></div><div class="meta">250ms · dropdown</div></div>
  <div class="row"><div class="label">slow</div><div class="bar" style="width: 70px"></div><div class="meta">350ms · modal enter</div></div>
  <div class="row"><div class="label">slower</div><div class="bar" style="width: 100px"></div><div class="meta">500ms · hero reveal</div></div>
  <div class="row"><div class="label">lazy</div><div class="bar" style="width: 140px"></div><div class="meta">700ms · skeleton fade</div></div>
</div>
</body></html>
