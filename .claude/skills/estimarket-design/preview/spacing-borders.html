<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 20px; background: var(--color-bg-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-primary); flex: 1; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .demo { width: 84px; }
  .thin { border-top: 1px solid var(--color-neutral-300); }
  .med  { border-top: 2px solid var(--color-primary); }
  .thick { border-top: 4px solid var(--color-primary); }
  .ring { width: 36px; height: 36px; border-radius: var(--radius-sm); }
  .focus { box-shadow: 0 0 0 2px var(--color-bg-surface), 0 0 0 4px var(--color-primary); }
</style></head><body>
<div class="grid">
  <div class="row"><div class="demo thin"></div><div class="label">border-thin</div><div class="px">1px</div></div>
  <div class="row"><div class="demo med"></div><div class="label">border-medium</div><div class="px">2px</div></div>
  <div class="row"><div class="demo thick"></div><div class="label">border-thick</div><div class="px">4px</div></div>
  <div class="row"><div class="ring focus" style="background:#fff;border:1px solid #D1D5DB"></div><div class="label">focus-visible</div><div class="px">2px / 2px</div></div>
</div>
</body></html>
