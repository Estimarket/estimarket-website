<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px 20px; background: var(--color-bg-surface); display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px; border-radius: 4px; font-family: var(--font-body); font-size: 16px; font-weight: 600; letter-spacing: 0.01em; border: 0; cursor: pointer; transition: filter var(--duration-fast) var(--ease-out); }
  .btn:hover { filter: brightness(0.92); }
  .btn-primary { background: #E85D26; color: #fff; }
  .btn-secondary { background: #245ABC; color: #fff; }
  .btn-outline { background: transparent; color: #245ABC; box-shadow: inset 0 0 0 2px #245ABC; }
  .btn-ghost { background: transparent; color: #245ABC; }
  .btn-destructive { background: #DC2626; color: #fff; }
  .btn-disabled { background: #D1D5DB; color: #6B7280; cursor: not-allowed; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); flex: 0 0 80px; }
</style></head><body>
<div class="row"><div class="lbl">primary</div><button class="btn btn-primary">Search cabins</button><button class="btn btn-primary">Book now</button></div>
<div class="row"><div class="lbl">secondary</div><button class="btn btn-secondary">See availability</button><button class="btn btn-outline">Explore homes</button><button class="btn btn-ghost">Learn more</button></div>
<div class="row"><div class="lbl">other</div><button class="btn btn-destructive">Cancel booking</button><button class="btn btn-disabled" disabled>Disabled</button></div>
</body></html>
