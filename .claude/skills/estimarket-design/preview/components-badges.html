<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px 20px; background: var(--color-bg-surface); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
</style></head><body>
<div class="row">
  <span class="badge" style="background:#F3F4F6;color:#374151">Wifi</span>
  <span class="badge" style="background:#F3F4F6;color:#374151">Hot tub</span>
  <span class="badge" style="background:#E8F2FF;color:#1C4695">Pet-friendly</span>
  <span class="badge" style="background:#DCFCE7;color:#166534">Superhost</span>
  <span class="badge" style="background:#DCFCE7;color:#166534">Verified</span>
  <span class="badge" style="background:#FEF3C7;color:#92400E">Last chance</span>
  <span class="badge" style="background:#FEE2E2;color:#991B1B">Unavailable</span>
  <span class="badge" style="background:#FEE9DF;color:#C04E18">Popular</span>
  <span class="badge" style="background:#FEE9DF;color:#C04E18">25% off</span>
  <span class="badge" style="background:#0E214B;color:#fff">New</span>
</div>
</body></html>
